{{define "partials/publishing/form"}}
{{$d := index .Data "Draft"}}
{{if .Flash}}<div class="notice">{{.Flash}}</div>{{end}}
<form class="panel form-stack" hx-post="/projects/{{$d.ProjectID}}/publish/draft" hx-target="#publish-draft-form">
<label>Tool name<input name="app_name" value="{{$d.AppName}}"></label>
<label>Headline<input name="headline" value="{{$d.Headline}}"></label>
<label>Description<textarea name="description" placeholder="Left blank, the headline is used.">{{$d.Description}}</textarea></label>
<label>Changelog<textarea name="changelog">{{$d.Changelog}}</textarea></label>
<input type="hidden" name="publish_target" value="organization">
<input type="hidden" name="visibility" value="unlisted">
<p class="muted">This builds the tool on this desk. It is not a public listing. Sharing is a separate switch, and it sends the recipe, not the data.</p>
<label>Lifetime<select name="expires_days"><option value="0" {{if eq $d.ExpiresDays 0}}selected{{end}}>Keep</option><option value="1" {{if eq $d.ExpiresDays 1}}selected{{end}}>Disposable — 1 day</option><option value="7" {{if eq $d.ExpiresDays 7}}selected{{end}}>Disposable — 1 week</option><option value="30" {{if eq $d.ExpiresDays 30}}selected{{end}}>Disposable — 1 month</option></select><span class="muted">A disposable tool stops and leaves the desk when time is up. The project stays.</span></label>
<label class="check"><input type="checkbox" name="auto_install"{{if $d.AutoInstall}} checked{{end}}> Start it on this desk when the build succeeds</label>
<div class="actions"><button class="button primary" hx-post="/projects/{{$d.ProjectID}}/publish" hx-target="#publishing-job-list">Build on this desk</button><button class="button">Save draft only</button></div>
</form>
{{end}}
